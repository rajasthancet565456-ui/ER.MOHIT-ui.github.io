name: Inject Script to HTML Files

on:
  push:
    branches: [ main ]

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Add script to HTML files
        run: |
          python3 -c '
          import os
          for root, dirs, files in os.walk("."):
              for file in files:
                  if file.endswith(".html"):
                      filepath = os.path.join(root, file)
                      with open(filepath, "r", encoding="utf-8", errors="ignore") as f:
                          content = f.read()
                      
                      # Remove old variants to avoid duplicates
                      content = content.replace("<script src=\"app.js\"></script>", "")
                      content = content.replace("<script src=\"https://rajasthancet565456-ui.github.io/ER.MOHIT-ui.github.io/app.js\"></script>", "")
                      
                      if "</body>" in content:
                          script_tag = "<script src=\"https://rajasthancet565456-ui.github.io/ER.MOHIT-ui.github.io/app.js\"></script>\n</body>"
                          content = content.replace("</body>", script_tag)
                          with open(filepath, "w", encoding="utf-8") as f:
                              f.write(content)
                          print(f"Updated: {file}")
          '

      - name: Commit and push if changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Inject absolute path app.js into all HTML files"
          branch: main
